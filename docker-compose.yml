services:

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: auth-service
    restart: unless-stopped
    env_file: ./services/auth-service/cmd/.env
    expose:
      - "50051"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal

  user-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: user-service
    restart: unless-stopped
    env_file: ./services/user-service/cmd/.env
    expose:
      - "50052"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal

  chat-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: chat-service
    restart: unless-stopped
    env_file: ./services/chat-service/cmd/.env
    expose:
      - "50053"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal

  messaging-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: messaging-service
    restart: unless-stopped
    env_file: ./services/messaging-service/cmd/.env
    expose:
      - "50054"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal

  friends-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: friends-service
    restart: unless-stopped
    env_file: ./services/friends-service/cmd/.env
    expose:
      - "50055"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal

  call-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: call-service
    restart: unless-stopped
    env_file: ./services/call-service/cmd/.env
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro

    ports:
      - "8082:8082/udp"
      - "10000-10200:10000-10200/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal

  coturn:
    image: coturn/coturn:4
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49152-49250:49152-49250/udp"
    volumes:
      - ./coturn.conf:/etc/turnserver.conf:ro
    networks:
      - internal

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: gateway-service
    restart: unless-stopped
    env_file: ./services/gateway-service/cmd/.env
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro

    ports:
      - "8081:8081"
    depends_on:
      - auth-service
      - user-service
      - chat-service
      - messaging-service
      - friends-service
      - call-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal

  s3-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: s3-service
    restart: unless-stopped
    env_file: ./services/s3-service/cmd/.env
    expose:
      - "50056"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal

networks:
  internal:
    driver: bridge
