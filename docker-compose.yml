services:

  # ── Микросервисы ─────────────────────────────────────────────────────────────
  # Postgres и Redis работают на хосте — контейнеры достукиваются через host-gateway.

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: auth-service
    restart: unless-stopped
    env_file: ./services/auth-service/cmd/.env
    expose:
      - "50051"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal

  user-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: user-service
    restart: unless-stopped
    env_file: ./services/user-service/cmd/.env
    expose:
      - "50052"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal

  chat-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: chat-service
    restart: unless-stopped
    env_file: ./services/chat-service/cmd/.env
    expose:
      - "50053"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal

  messaging-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: messaging-service
    restart: unless-stopped
    env_file: ./services/messaging-service/cmd/.env
    expose:
      - "50054"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal

  friends-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: friends-service
    restart: unless-stopped
    env_file: ./services/friends-service/cmd/.env
    expose:
      - "50055"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal

  call-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: call-service
    restart: unless-stopped
    env_file: ./services/call-service/cmd/.env
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro   # TLS certs for DTLS
    ports:
      - "8082:8082/udp"                    # DTLS — desktop клиент
      - "10000-10200:10000-10200/udp"      # WebRTC ICE (pion ephemeral UDP)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal

  coturn:
    image: coturn/coturn:4
    restart: unless-stopped
    ports:
      - "3478:3478/udp"                    # TURN allocation
      - "3478:3478/tcp"                    # TURN over TCP (fallback)
      - "49152-49250:49152-49250/udp"      # TURN relay data
    volumes:
      - ./coturn.conf:/etc/turnserver.conf:ro
    networks:
      - internal

  # ── Gateway — единственная точка входа из интернета ──────────────────────────

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: gateway-service
    restart: unless-stopped
    env_file: ./services/gateway-service/cmd/.env
    ports:
      - "8081:8081"
    depends_on:
      - auth-service
      - user-service
      - chat-service
      - messaging-service
      - friends-service
      - call-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal

# ── Сеть ─────────────────────────────────────────────────────────────────────

networks:
  internal:
    driver: bridge
