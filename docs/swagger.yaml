host: api.postly-mes.ru:8081
info:
  contact: {}
  description: API Gateway for all services. All incoming traffic is routed through
    this microservice.
  title: Gateway Service API
  version: "1.0"
paths:
  /acceptFriendRequest:
    post:
      consumes:
      - application/json
      description: Accepts an incoming friend request by request ID
      parameters:
      - description: Request ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/swagger.FriendActionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'Status: true'
          schema:
            $ref: '#/definitions/swagger.StatusResponse'
        "400":
          description: Bad request
          schema:
            type: string
        "401":
          description: Unauthorized
        "404":
          description: Request not found
          schema:
            additionalProperties:
              type: string
            type: object
        "405":
          description: Method not allowed
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Accept friend request
      tags:
      - friends
  /avatar:
    get:
      description: Streams the binary image of an avatar from S3 by key or user_id
      parameters:
      - description: Avatar S3 key
        example: '"avatars/usr_12345/avatar.png"'
        in: query
        name: key
        type: string
      - description: Target user ID
        example: '"usr_12345"'
        in: query
        name: user_id
        type: string
      produces:
      - image/*
      - application/octet-stream
      responses:
        "200":
          description: Avatar binary stream
          schema:
            type: file
        "400":
          description: key or user_id required
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Not found
          schema:
            type: string
        "405":
          description: Method not allowed
          schema:
            type: string
        "500":
          description: Internal error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get avatar image
      tags:
      - user
  /cancelFriendRequest:
    post:
      consumes:
      - application/json
      description: Cancels a pending outgoing friend request sent by the authorized
        user
      parameters:
      - description: Request ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/swagger.FriendActionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'OK: true'
          schema:
            $ref: '#/definitions/swagger.OKResponse'
        "400":
          description: Bad request
          schema:
            type: string
        "401":
          description: Unauthorized
        "404":
          description: Request not found
          schema:
            additionalProperties:
              type: string
            type: object
        "405":
          description: Method not allowed
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Cancel outgoing friend request
      tags:
      - friends
  /clearChat:
    post:
      consumes:
      - application/json
      description: Clears message history for a specific chat by ID
      parameters:
      - description: chat_id in the body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/swagger.ClearChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'Status: true'
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad request
          schema:
            type: string
        "401":
          description: Unauthorized
        "403":
          description: Error clearing chat (forbidden)
          schema:
            additionalProperties:
              type: string
            type: object
        "405":
          description: Method not allowed
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Clearing the chat
      tags:
      - chat
  /createChat:
    post:
      consumes:
      - application/json
      description: Create a new chat if it doesn't exist; otherwise, get its ID
      parameters:
      - description: username and target_username in the body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/swagger.CreateChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: New chat
          schema:
            $ref: '#/definitions/swagger.CreateChatResponse'
        "400":
          description: Bad request
          schema:
            type: string
        "401":
          description: Unauthorized
        "404":
          description: User was not found
          schema:
            additionalProperties:
              type: string
            type: object
        "405":
          description: Method not allowed
          schema:
            type: string
        "500":
          description: Error creating chat
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Creating chat
      tags:
      - chat
  /createGroup:
    post:
      consumes:
      - application/json
      description: Create a new group if it doesn't exist; otherwise, get its ID
      parameters:
      - description: name, members, avatar in the body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/swagger.CreateGroupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: New group details
          schema:
            $ref: '#/definitions/swagger.CreateGroupResponse'
        "400":
          description: Bad request
          schema:
            type: string
        "401":
          description: Unauthorized
        "405":
          description: Method not allowed
          schema:
            type: string
        "500":
          description: Error creating group
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Creating group
      tags:
      - chat
  /declineFriendRequest:
    post:
      consumes:
      - application/json
      description: Declines an incoming friend request by request ID
      parameters:
      - description: Request ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/swagger.FriendActionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'Status: true'
          schema:
            $ref: '#/definitions/swagger.StatusResponse'
        "400":
          description: Bad request
          schema:
            type: string
        "401":
          description: Unauthorized
        "404":
          description: Request not found
          schema:
            additionalProperties:
              type: string
            type: object
        "405":
          description: Method not allowed
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Decline friend request
      tags:
      - friends
  /deleteAvatar:
    post:
      consumes:
      - application/json
      description: Removes an avatar from the user profile and deletes the file from
        S3 storage
      parameters:
      - description: S3 key of the avatar to delete
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/swagger.DeleteAvatarRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Avatar deleted successfully
          schema:
            $ref: '#/definitions/swagger.StatusResponse'
        "400":
          description: Bad request
          schema:
            type: string
        "401":
          description: Unauthorized
        "404":
          description: Avatar not found
          schema:
            additionalProperties:
              type: string
            type: object
        "405":
          description: Method not allowed
          schema:
            type: string
        "500":
          description: Failed to delete avatar
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete avatar
      tags:
      - user
  /deleteChat:
    post:
      consumes:
      - application/json
      description: Completely deletes a private chat by chat_id
      parameters:
      - description: chat_id in the body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/swagger.DeleteChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'Status: true'
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad request
          schema:
            type: string
        "401":
          description: Unauthorized
        "403":
          description: Error deleting chat
          schema:
            additionalProperties:
              type: string
            type: object
        "405":
          description: Method not allowed
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Deleting chat
      tags:
      - chat
  /deleteFriend:
    post:
      consumes:
      - application/json
      description: Removes a user from friends by user ID or username
      parameters:
      - description: Friend ID or username
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/swagger.DeleteFriendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Friend deleted successfully
          schema:
            $ref: '#/definitions/swagger.SuccessResponse'
        "400":
          description: Bad request
          schema:
            type: string
        "401":
          description: Unauthorized
        "405":
          description: Method not allowed
          schema:
            type: string
        "409":
          description: Friend deletion conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete friend
      tags:
      - friends
  /deleteGroup:
    post:
      consumes:
      - application/json
      description: Completely deletes a group chat by chat_id
      parameters:
      - description: chat_id in the body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/swagger.DeleteGroupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'Status: true'
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad request
          schema:
            type: string
        "401":
          description: Unauthorized
        "403":
          description: Error deleting group
          schema:
            additionalProperties:
              type: string
            type: object
        "405":
          description: Method not allowed
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Deleting group
      tags:
      - chat
  /deleteMessage:
    post:
      consumes:
      - application/json
      description: Deletes a message created by the authorized user
      parameters:
      - description: Message ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/swagger.DeleteMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Message deleted successfully
          schema:
            $ref: '#/definitions/swagger.DeleteMessageResponse'
        "400":
          description: Bad request
          schema:
            type: string
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (cannot delete other users' messages)
          schema:
            additionalProperties:
              type: string
            type: object
        "405":
          description: Method not allowed
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Delete message
      tags:
      - messaging
  /file:
    get:
      description: Verifies user membership in the chat containing the target message
        and proxies the file from S3. Supports HTTP Range requests for media streaming
        and client caching.
      parameters:
      - description: Message ID associated with the attachment
        example: '"alksjNSA212fc"'
        in: query
        name: message_id
        required: true
        type: string
      - description: HTTP Range header for chunked streaming (e.g., bytes=0-1024)
        in: header
        name: Range
        type: string
      produces:
      - application/octet-stream
      - image/*
      - video/*
      responses:
        "200":
          description: Full binary file stream
          schema:
            type: file
        "206":
          description: Partial content (media streaming chunks)
          schema:
            type: file
        "400":
          description: message_id required
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Not found
          schema:
            type: string
        "405":
          description: Method not allowed
          schema:
            type: string
        "500":
          description: Internal error
          schema:
            type: string
        "502":
          description: Bad gateway
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Download or stream a file
      tags:
      - files
  /getAvatarUploadUrl:
    post:
      consumes:
      - application/json
      description: Generates a pre-signed S3 URL for uploading an avatar image (JPEG,
        PNG, WebP)
      parameters:
      - description: File name and MIME type
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/swagger.GetAvatarUploadURLRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Pre-signed upload URL and S3 key
          schema:
            $ref: '#/definitions/swagger.GetAvatarUploadURLResponse'
        "400":
          description: Only JPEG, PNG and WebP are supported
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
        "405":
          description: Method not allowed
          schema:
            type: string
        "500":
          description: Failed to get upload URL
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get avatar upload URL
      tags:
      - user
  /getAvatars:
    get:
      description: Returns a list of all avatars uploaded by a user. Defaults to the
        authorized user if user_id query parameter is not provided.
      parameters:
      - description: Optional target user ID
        example: '"usr_12345"'
        in: query
        name: user_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of avatars
          schema:
            items:
              $ref: '#/definitions/swagger.AvatarItem'
            type: array
        "401":
          description: Unauthorized
        "405":
          description: Method not allowed
          schema:
            type: string
        "500":
          description: Failed to get avatars
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get avatar history
      tags:
      - user
  /getChats:
    get:
      description: Returning the list of chats by JWT Token. Implemented in the init_client
        endpoint.
      produces:
      - application/json
      responses:
        "200":
          description: The list of chats
          schema:
            items:
              $ref: '#/definitions/gateway-service_internal_router_initrouter.Chats'
            type: array
        "401":
          description: Unauthorized
        "500":
          description: Error getting chats
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Getting chats
      tags:
      - depricated
  /getFriendRequests:
    get:
      description: Returns a list of all incoming friend requests for the authorized
        user. Implemented in the init_client endpoint.
      produces:
      - application/json
      responses:
        "200":
          description: List of received friend requests
          schema:
            items:
              $ref: '#/definitions/swagger.FriendRequestItem'
            type: array
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get received friend requests
      tags:
      - depricated
  /getFriends:
    get:
      description: Returns a list of all confirmed friends for the authorized user.
        Implemented in the init_client endpoint.
      produces:
      - application/json
      responses:
        "200":
          description: List of friends
          schema:
            items:
              $ref: '#/definitions/swagger.FriendItem'
            type: array
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get friends list
      tags:
      - depricated
  /getGroups:
    get:
      description: Getting user groups by JWT Token. Implemented in the init_client
        endpoint.
      produces:
      - application/json
      responses:
        "200":
          description: The list of groups
          schema:
            items:
              $ref: '#/definitions/gateway-service_internal_router_initrouter.Groups'
            type: array
        "401":
          description: Unauthorized
        "500":
          description: Error getting groups
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Getting groups
      tags:
      - depricated
  /getMessages:
    get:
      description: Returns the initial page of messages for a chat. Messages are returned
        in reverse chronological order (newest first). Chat ID can be provided via
        query param or JSON body.
      parameters:
      - description: Chat ID
        example: '"cht_102938"'
        in: query
        name: chat_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of messages in reverse chronological order (newest first)
          schema:
            items:
              $ref: '#/definitions/swagger.MessageItem'
            type: array
        "400":
          description: chat_id required
          schema:
            type: string
        "401":
          description: Unauthorized
        "500":
          description: Failed to fetch messages
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get recent messages
      tags:
      - messaging
  /getMoreMessages:
    post:
      consumes:
      - application/json
      description: Fetches the next chunk of older chat messages before a given message
        cursor. Messages are returned in reverse chronological order (newest first).
      parameters:
      - description: Cursor pagination parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/swagger.GetMoreMessagesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: List of older messages in reverse chronological order
          schema:
            items:
              $ref: '#/definitions/swagger.MessageItem'
            type: array
        "400":
          description: Invalid JSON or chat_id required
          schema:
            type: string
        "401":
          description: Unauthorized
        "500":
          description: Failed to fetch messages
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get older messages (cursor pagination)
      tags:
      - messaging
  /getSentRequests:
    get:
      description: Returns a list of all pending outgoing friend requests sent by
        the authorized user. Implemented in the init_client endpoint.
      produces:
      - application/json
      responses:
        "200":
          description: List of sent friend requests
          schema:
            items:
              $ref: '#/definitions/swagger.SentRequestItem'
            type: array
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get sent friend requests
      tags:
      - depricated
  /getUploadUrl:
    post:
      consumes:
      - application/json
      description: Generates a pre-signed S3 URL to upload media or file attachments
        directly from the client
      parameters:
      - description: Attachment metadata
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/swagger.GetUploadURLRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Pre-signed upload URL and S3 key
          schema:
            $ref: '#/definitions/swagger.GetUploadURLResponse'
        "400":
          description: Bad request
          schema:
            type: string
        "401":
          description: Unauthorized
        "405":
          description: Method not allowed
          schema:
            type: string
        "500":
          description: Failed to get upload URL
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get upload URL for message attachment
      tags:
      - messaging
  /getVersion:
    get:
      description: Returns current gateway service version for client-side compatibility
        checks
      produces:
      - application/json
      responses:
        "200":
          description: Current version information
          schema:
            $ref: '#/definitions/swagger.VersionResponse'
        "405":
          description: Method not allowed
          schema:
            type: string
      summary: Get current version
      tags:
      - version
  /init_client:
    get:
      consumes:
      - application/json
      description: Retrieves an aggregated overview of the user's active chats, groups,
        friends, and incoming & outgoing friend requests.
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved client initialization data
          schema:
            $ref: '#/definitions/internal_router_initrouter.initResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal server error while retrieving data or encoding JSON
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Initialize client data
      tags:
      - init
  /login:
    post:
      consumes:
      - application/json
      description: Accepts username and password, validates credentials, and returns
        user ID, JWT token, and username
      parameters:
      - description: User credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/swagger.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully authenticated
          schema:
            $ref: '#/definitions/swagger.LoginResponse'
        "400":
          description: Bad request
          schema:
            type: string
        "401":
          description: Invalid username or password
          schema:
            $ref: '#/definitions/swagger.AuthErrorResponse'
        "405":
          description: Method not allowed
          schema:
            type: string
      summary: User login
      tags:
      - auth
  /register:
    post:
      consumes:
      - application/json
      description: Registers a new user and sets initial authentication credentials.
        Rate limited by IP/username.
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/swagger.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Registered successfully
          schema:
            $ref: '#/definitions/swagger.StatusResponse'
        "400":
          description: Bad request
          schema:
            type: string
        "405":
          description: Method not allowed
          schema:
            type: string
        "409":
          description: Username or email already exists
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Registration failed. Try again.
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User registration
      tags:
      - user
  /registerFCMToken:
    post:
      consumes:
      - application/json
      description: Saves or updates the Firebase Cloud Messaging device token in Redis
        cache for push notifications
      parameters:
      - description: FCM device token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/swagger.FCMRegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Token registered successfully
          schema:
            $ref: '#/definitions/swagger.OKResponse'
        "400":
          description: Bad request (empty token or invalid JSON)
          schema:
            type: string
        "401":
          description: Unauthorized
        "405":
          description: Method not allowed
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Register FCM token
      tags:
      - fcm
  /sendFriendRequest:
    post:
      consumes:
      - application/json
      description: Sends a friendship invitation to target user by username
      parameters:
      - description: Recipient username
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/swagger.SendFriendRequestReq'
      produces:
      - application/json
      responses:
        "200":
          description: Request sent successfully
          schema:
            $ref: '#/definitions/swagger.SendFriendRequestResponse'
        "400":
          description: Bad request
          schema:
            type: string
        "401":
          description: Unauthorized
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
        "405":
          description: Method not allowed
          schema:
            type: string
        "409":
          description: Friend request conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Send friend request
      tags:
      - friends
  /sendMessage:
    post:
      consumes:
      - application/json
      description: Sends a new text message to the specified chat. Implemented in
        the ws endpoint, use NEW_MESSAGE event.
      parameters:
      - description: Chat ID and message text
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/swagger.SendMessageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Message sent successfully
          schema:
            $ref: '#/definitions/swagger.SendMessageResponse'
        "400":
          description: Bad request
          schema:
            type: string
        "401":
          description: Unauthorized
        "405":
          description: Method not allowed
          schema:
            type: string
        "500":
          description: Failed to send message
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Send message
      tags:
      - depricated
  /setAvatar:
    post:
      consumes:
      - application/json
      description: Assigns an uploaded S3 avatar key as the active profile avatar
      parameters:
      - description: S3 key of the uploaded avatar
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/swagger.SetAvatarRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Avatar updated successfully
          schema:
            $ref: '#/definitions/swagger.StatusResponse'
        "400":
          description: Invalid file key
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
        "403":
          description: Forbidden file key
          schema:
            additionalProperties:
              type: string
            type: object
        "405":
          description: Method not allowed
          schema:
            type: string
        "409":
          description: This avatar is already set
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to set avatar
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Set active avatar
      tags:
      - user
  /verify:
    get:
      description: Extracts Bearer token from the Authorization header, validates
        it, and returns the user ID
      produces:
      - application/json
      responses:
        "200":
          description: Token is valid, returns user ID
          schema:
            $ref: '#/definitions/swagger.VerifyResponse'
        "401":
          description: Unauthorized (token missing or invalid)
      security:
      - BearerAuth: []
      summary: Validate JWT token
      tags:
      - auth
  /ws:
    get:
      description: Establishes a bidirectional WebSocket connection for real-time
        messaging, typing indicators, and call signaling. Requires a valid JWT token
        passed via the token query parameter.
      parameters:
      - description: JWT auth token (e.g. Bearer eyJhbGci... or raw JWT)
        example: '"eyJhbGciOi..."'
        in: query
        name: token
        required: true
        type: string
      responses:
        "101":
          description: 'Switching Protocols: successfully upgraded to WebSocket connection'
        "401":
          description: 'Unauthorized: token is missing, invalid or expired'
          schema:
            type: string
      summary: WebSocket connection upgrade
      tags:
      - websocket
swagger: "2.0"
