syntax = "proto3";

package s3;

option go_package = "s3-service/proto/s3;s3pb";

service FileService {
  rpc UploadFile(stream UploadFileRequest) returns (UploadFileResponse);
  
  rpc GetDownloadUrl(GetDownloadUrlRequest) returns (GetDownloadUrlResponse);

  // Presigned PUT-ссылка для прямой загрузки клиентом в бакет.
  // Ключ генерирует сервер: {folder}/{user_id}/{random}{ext}
  rpc GetUploadUrl(GetUploadUrlRequest) returns (GetUploadUrlResponse);
  
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);

  rpc NewS3Client(NewS3ClientRequest) returns (NewS3ClientResponse);
}

message NewS3ClientRequest {

}

message NewS3ClientResponse {

}

message UploadFileRequest {
  oneof data {
    string file_name = 1; // Например: "avatars/user_123.jpg"
    bytes chunk = 2;
  }
}

message UploadFileResponse {
  string s3_key = 1; // Уникальный путь, под которым файл сохранился в Selectel
  string file_url = 2;
}

message GetDownloadUrlRequest {
  string s3_key = 1;       // Ключ файла в бакете
  int64 expires_in_sec = 2; // Срок действия ссылки в секундах
}

message GetDownloadUrlResponse {
  string url = 1;
}

message GetUploadUrlRequest {
  string user_id = 1;
  string file_name = 2;     // Оригинальное имя — нужно только для расширения
  string content_type = 3;
  int64 expires_in_sec = 4;
  string folder = 5;        // images | videos | voices | files
}

message GetUploadUrlResponse {
  string upload_url = 1;
  string s3_key = 2;
}

message DeleteFileRequest {
  string s3_key = 1;
}

message DeleteFileResponse {
  bool success = 1;
}
