syntax = "proto3";
package messaging;
option go_package = "proto/messaging";

service MessagingService {
  rpc GetMessages(GetMessagesRequest)           returns (GetMessagesResponse);
  rpc SendMessage(SendMessageRequest)           returns (SendMessageResponse);
  rpc DeleteMessage(DeleteMessageRequest)       returns (DeleteMessageResponse);
  rpc DeleteChatMessages(DeleteChatMsgsRequest) returns (DeleteChatMsgsResponse);
  rpc GetFileInfo(GetFileInfoRequest)           returns (GetFileInfoResponse);
}

message Message {
  string id         = 1;
  string chat_id    = 2;
  string sender_id  = 3;
  string text       = 4;
  int64  created_at = 5;
  string type       = 6;
  string file_url   = 7;
  string file_size  = 8;
  string file_name  = 9;

}

message GetMessagesRequest  { string chat_id = 1; }
message GetMessagesResponse { repeated Message messages = 1; }

message SendMessageRequest {
  string chat_id   = 1;
  string sender_id = 2;
  string text      = 3;
  string type      = 4;
  string file_url  = 5;
  string file_size = 6;
  string file_name = 7;
}

message SendMessageResponse { string message_id = 1; }

message DeleteMessageRequest  { string message_id = 1; string sender_id = 2; }
message DeleteMessageResponse { string chat_id = 1; }

// Данные для отдачи файла сообщения через gateway
message GetFileInfoRequest  { string message_id = 1; }
message GetFileInfoResponse {
  string chat_id   = 1;
  string type      = 2;
  string s3_key    = 3;
  string file_name = 4;
}

message DeleteChatMsgsRequest  { string chat_id = 1; }
message DeleteChatMsgsResponse { bool ok = 1; }
